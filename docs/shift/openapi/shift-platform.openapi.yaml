openapi: 3.0.3
info:
  title: Shift Platform API
  version: 1.0.0
  description: |
    API specification for authentication, shift reporting, file upload, and chat messaging modules.
servers:
  - url: https://api.example.com
    description: Production server
  - url: https://staging.api.example.com
    description: Staging server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthenticationResponse:
      type: object
      required: [token, username]
      properties:
        token:
          type: string
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, fullName, email, phone]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 64
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: "^(\\+?84|0)\\d{9}$"
        roleIds:
          type: array
          items:
            type: integer
            format: int64
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ShiftReport:
      $ref: '../json-schema/shift-report.schema.json'
    ShiftSessionEvent:
      $ref: '../json-schema/shift-session-event.schema.json'
    FileUploadResponse:
      type: object
      required: [fileName, fileUrl, fileSize, fileType]
      properties:
        fileName:
          type: string
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          format: int64
        fileType:
          type: string
        message:
          type: string
    ConversationSummary:
      $ref: '../json-schema/conversation.schema.json'
    Message:
      $ref: '../json-schema/message.schema.json'
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login and retrieve JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      summary: Register new account
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration success, returns token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shifts/reports/sessions/{sessionId}:
    get:
      summary: Get shift report by session
      tags: [ShiftReport]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Report fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftReport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Report or session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shifts/reports/sessions/{sessionId}/regenerate:
    post:
      summary: Regenerate shift report
      tags: [ShiftReport]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Report regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftReport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shifts/reports/work-shifts/{workShiftId}:
    get:
      summary: List reports by work shift
      tags: [ShiftReport]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workShiftId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Array of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftReport'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/files/upload:
    post:
      summary: Upload single file
      tags: [Files]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Empty or invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/files/{fileName}:
    get:
      summary: Download file
      tags: [Files]
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete file
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/chat/conversations:
    get:
      summary: List current user conversations
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged conversations
          content:
            application/json:
              schema:
                $ref: '../json-schema/page-conversation.schema.json'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chat/conversations/{conversationId}/messages:
    get:
      summary: List messages in conversation
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: beforeMessageId
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Messages page
          content:
            application/json:
              schema:
                $ref: '../json-schema/page-message.schema.json'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
